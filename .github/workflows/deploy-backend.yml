name: Build & Deploy backend
on:
  push:
    branches: [ "deploy" ]
  workflow_dispatch:
jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}
      - name: Login a ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'
      - name: Build y push backend
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/casino-backend
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -t $IMAGE:v1.0.0 .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker push $IMAGE:v1.0.0
      - name: Deploy en EC2 backend via SSM
        run: |
          IMAGE=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/casino-backend:latest
          INSTANCE_ID=${{ secrets.EC2_BACKEND_INSTANCE_ID }}
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters commands="[
              \"aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com\",
              \"docker pull $IMAGE\",
              \"docker rm -f casino-backend || true\",
              \"docker run -d --name casino-backend --restart unless-stopped -p 3000:3000 -e DB_HOST=${{ secrets.DB_HOST_PRIVATE }} -e DB_USER=casino -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} -e DB_NAME=casino_db -e JWT_SECRET=${{ secrets.JWT_SECRET }} -e CORS_ORIGIN=* $IMAGE\"
            ]" \
            --region ${{ secrets.AWS_REGION }}
