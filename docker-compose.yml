services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: casino_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - casino-net

  backend:
    build: .
    environment:
      DB_HOST: db
      DB_USER: casino
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: casino_db
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      - db
    networks:
      - casino-net

  frontend:
    build: ../frontend_intro_devops_casino_vidal
    environment:
      BACKEND_HOST: backend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      - casino-net

volumes:
  pg_data:

networks:
  casino-net: