version: '3.9'

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: casino
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: casino_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - casino-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casino -d casino_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    environment:
      DB_HOST: db
      DB_USER: casino
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: casino_db
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGIN: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy 
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ../frontend_intro_devops_casino_vidal
    environment:
      BACKEND_HOST: backend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy 
    networks:
      - casino-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:

networks:
  casino-net: